<div class="idle-dialog">

  <div class="idle-header">
    <div class="idle-header-icon">
      <mat-icon>lock_clock</mat-icon>
    </div>
    <div>
      <h2 class="idle-title">Are you still there?</h2>
      <p class="idle-subtitle">
        For your security, you'll be signed out in <strong>{{ secondsLeft }}s</strong> because of inactivity.
      </p>
    </div>
  </div>

  <div class="idle-actions">
    <button mat-button (click)="signOut()">Sign out</button>
    <button mat-raised-button color="primary" (click)="staySignedIn()">Stay signed in</button>
  </div>

</div>
