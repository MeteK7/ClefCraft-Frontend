<div class="board-item" (click)="onClick()">
  <div class="item-header">
    <h4>{{ item.title }}</h4>
  </div>

  <div class="tags">
    @for (tag of item.tags; track tag) {
      <span class="tag">
        {{ tag.name }}
      </span>
    }
  </div>

  <!-- Some of the item's asks wait on the viewer (AskTurn on the server). Deliberately the loudest
       thing on the card, so a pending move is hard to ignore and clearing it is felt: words and
       shape, not colour alone. Screen readers get the sentence instead of the graphic. -->
  @if (yourMove > 0) {
    <div class="your-move">
      <span class="your-move-signal" aria-hidden="true">
        <span class="your-move-stripe"></span><span class="your-move-stripe"></span>
        <span class="your-move-banner"><span>Your move</span></span>
        @if (yourMove > 1) {
          <span class="your-move-count">{{ countLabel }}</span>
        }
        <span class="your-move-bar"></span><span class="your-move-bar"></span><span class="your-move-bar"></span>
      </span>
      <span class="visually-hidden">Your move on {{ yourMove === 1 ? '1 ask' : yourMove + ' asks' }}</span>
    </div>
  }

  <div class="item-footer">
    @if (item.priorityId) {
      <div class="priority-container">
        <span
          class="priority-indicator"
          [ngClass]="'priority-' + item.priorityId"
          [matTooltip]="item.priorityName"
          matTooltipPosition="above"
          >
        </span>
      </div>
    }
    @if (item.fullName) {
      <div class="assignee-container">
        <span class="assignee">{{ item.fullName }}</span>
        <div class="avatar">{{ item.initials }}</div>
      </div>
    }
  </div>
</div>
