<div class="month-scroll-root">

    <div #scrollContainer class="month-scroll-container">

        <div class="month-scroll-header">
            <div class="calendar-header-cell" *ngFor="let day of weekdays">
                {{ day }}
            </div>
        </div>

        <div #topSentinel class="scroll-sentinel"></div>
        <div *ngFor="let row of window.weeks"
             class="calendar-week"
             [style.height.px]="rowHeight">
            <!-- Day grid -->
            <div class="days-grid">
                <div *ngFor="let date of row.dates; let i = index" class="calendar-day"
                    [id]="'day-' + (row.dates[0] | date:'yyyyMMdd') + '-' + i"
                    [class.selected]="isSameDate(date, selectedDate)" [class.today]="isToday(date)"
                    (click)="emptyDayClicked.emit(date)">
                    <div class="day">
                        <span>{{ date.getDate() }}</span>
                    </div>
                    <span *ngIf="getHiddenCountForDay(date, row) > 0" class="more-indicator"
                        [matMenuTriggerFor]="moreMenu" (click)="onMoreClicked(date, row, $event)">
                        +{{ getHiddenCountForDay(date, row) }} more
                    </span>
                </div>
            </div>

            <!-- Event overlay -->
            <div class="week-events-overlay" cdkDropList [cdkDropListData]="row"
                [cdkDropListEnterPredicate]="alwaysAllowDrop" (cdkDropListDropped)="eventDropped.emit($event)">
                <div class="week-events-layer">
                    <ng-container *ngFor="let item of row.layoutItems">
                        <div *ngIf="item.lane < maxVisibleLanes" class="event span-event" cdkDrag
                            [cdkDragData]="item.event" cdkDragPreviewContainer="global"
                            (cdkDragStarted)="monthDragStart.emit(item.event)" (cdkDragEnded)="monthDragEnd.emit()"
                            [class.linked]="item.event.linkedBoardItemId"
                            [style.grid-column]="item.columnStart + ' / span ' + item.columnSpan"
                            [style.grid-row]="item.lane + 1" [ngStyle]="item.event.eventColor
                ? {'border-left':'6px solid ' + item.event.eventColor}
                : {}" (click)="eventClicked.emit({event:item.event, mouseEvent:$event})">
                            <span class="event-title">
                                <mat-icon *ngIf="item.event.linkedBoardItemId" class="linked-icon">
                                    link
                                </mat-icon>
                                {{ item.event.subject }}
                            </span>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>

        <!-- Bottom sentinel: entering viewport triggers append of later weeks -->
        <div #bottomSentinel class="scroll-sentinel scroll-sentinel-bottom"></div>

    </div>
</div>

<!-- ==================== MORE MENU ==================== -->
<mat-menu #moreMenu="matMenu" class="more-menu">
    <div class="more-menu-header">{{ selectedMoreDate | date: 'EEE, MMM d' }}</div>
    <button mat-menu-item *ngFor="let event of selectedMoreEvents"
        (click)="eventClicked.emit({ event, mouseEvent: $event })">
        {{ event.subject }}
    </button>
</mat-menu>
