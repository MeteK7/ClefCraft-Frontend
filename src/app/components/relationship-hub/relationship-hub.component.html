<div class="relationship-hub">

    <div class="hub-header">

        <h3>Relationships</h3>

        <button mat-raised-button color="primary" (click)="addRelationship()">

            <mat-icon>add_link</mat-icon>

            Add Relationship

        </button>

        <div class="view-selector">

            <mat-button-toggle-group [(ngModel)]="viewMode">

                <mat-button-toggle value="graph">

                    <mat-icon>hub</mat-icon>

                    Graph

                </mat-button-toggle>

                <mat-button-toggle value="list">

                    <mat-icon>view_list</mat-icon>

                    List

                </mat-button-toggle>

            </mat-button-toggle-group>

        </div>

    </div>

    <div *ngIf="loading" class="loading">

        Loading...

    </div>

    <ng-container *ngIf="!loading">

        <app-relationship-graph *ngIf="viewMode==='graph'" [hub]="hub" [rootItemId]="itemId" [rootStatus]="itemStatus"
            [rootPriority]="itemPriority" (openItem)="open($event)"
            (maximizedChange)="graphMaximizedChange.emit($event)">
        </app-relationship-graph>

        <ng-container *ngIf="viewMode==='list'">

            <div class="empty-state" *ngIf="hub.groups.length===0">

                <mat-icon>link_off</mat-icon>

                <p>No relationships yet.</p>

            </div>

            <mat-accordion *ngIf="hub.groups.length>0" multi="true">

                <mat-expansion-panel *ngFor="let group of hub.groups; trackBy: trackGroup" [expanded]="group.expanded"
                    (expandedChange)="onGroupExpandedChange(group, $event)">

                    <mat-expansion-panel-header>

                        <mat-panel-title>

                            {{group.name}}

                        </mat-panel-title>

                        <mat-panel-description>

                            {{group.items.length}}

                        </mat-panel-description>

                    </mat-expansion-panel-header>

                    <app-relationship-card *ngFor="let relationship of group.items" [relationship]="relationship"
                        (open)="open($event)" (delete)="deleteRelationship($event)">

                    </app-relationship-card>

                </mat-expansion-panel>

            </mat-accordion>

        </ng-container>

    </ng-container>
</div>
